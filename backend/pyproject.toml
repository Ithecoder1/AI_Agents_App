[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-forge"
version = "0.1.0"
description = "Multi-provider vibe-coding platform: prompt authoring + pluggable agent execution engine."
requires-python = ">=3.10"
# Core runtime deps only. FastAPI/SQLAlchemy/httpx are added in Phases 3-4 and
# may ONLY be imported from vibe.infrastructure / vibe.api (see contracts below).
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "python-dotenv>=1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
    "types-jsonschema",
    "httpx>=0.27.0",
]

# Third-party packages self-register providers the same way (group "vibe.providers").
# Resolution order in ProviderRegistry: config `adapter` import path -> entry point by `kind`.
[project.entry-points."vibe.providers"]
fake = "vibe.infrastructure.providers.fake:FakeProvider"
openrouter = "vibe.infrastructure.providers.openrouter:OpenRouterProvider"
gemini = "vibe.infrastructure.providers.gemini:GeminiProvider"
anthropic = "vibe.infrastructure.providers.anthropic:AnthropicProvider"

[tool.setuptools.packages.find]
include = ["vibe*"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["vibe"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# Architecture contracts  (run: `lint-imports`)
#   api -> infrastructure -> application -> domain      (dependencies point inward only)
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_package = "vibe"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (api > infrastructure > application > domain)"
type = "layers"
layers = [
    "vibe.api",
    "vibe.infrastructure",
    "vibe.application",
    "vibe.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure (stdlib only)"
type = "forbidden"
source_modules = ["vibe.domain"]
forbidden_modules = [
    "yaml", "jsonschema", "dotenv", "pydantic", "fastapi", "starlette", "httpx",
    "sqlalchemy", "aiosqlite", "alembic", "requests", "aiohttp",
]

[[tool.importlinter.contracts]]
name = "Application layer is framework- and IO-free"
type = "forbidden"
source_modules = ["vibe.application"]
forbidden_modules = [
    "yaml", "jsonschema", "dotenv", "pydantic", "fastapi", "starlette", "httpx",
    "sqlalchemy", "aiosqlite", "alembic", "requests", "aiohttp",
]

# The extensibility guarantee: providers never import each other. Wildcard covers
# every future provider package automatically (scaffolded or third-party in-repo).
[[tool.importlinter.contracts]]
name = "Providers are independent of one another"
type = "independence"
modules = ["vibe.infrastructure.providers.*"]

# Providers may depend on domain, application ports and provider_kit - nothing else
# from infrastructure (no reaching into persistence, config loading, etc.).
[[tool.importlinter.contracts]]
name = "Providers do not reach into other infrastructure adapters"
type = "forbidden"
source_modules = ["vibe.infrastructure.providers"]
forbidden_modules = [
    "vibe.infrastructure.persistence",
    "vibe.infrastructure.eventing",
    "vibe.infrastructure.artifacts",
    "vibe.infrastructure.config",
]
