# Provider registry. Add a provider by appending an entry here (or in providers.local.yaml,
# which is git-ignored and merged by `id`). No core code changes are ever required.
# Secrets: reference env vars as ${VAR}; never write literal keys in this file.
version: 1
providers:
  - id: fake
    kind: fake
    display_name: Fake (offline demo)
    adapter: vibe_providers.adapters.fake:FakeProvider
    enabled: true
    options:
      delay_ms: 40
      emit_artifact: true

  # --- LLM "thinking" providers: enable once the matching API key is set ------------
  # Reasoning/thinking is streamed as THOUGHT events. Per-task overrides go in
  # ExecutionParams.extra (e.g. {"thinking_budget": 4096}, {"reasoning": {"effort": "high"}}).
  - id: openrouter-default
    kind: openrouter
    display_name: OpenRouter
    adapter: vibe_providers.adapters.openrouter:OpenRouterProvider
    enabled: false
    max_concurrency: 4
    options:
      base_url: https://openrouter.ai/api/v1
      default_model: anthropic/claude-sonnet-4
      api_key: ${OPENROUTER_API_KEY}

  - id: gemini-default
    kind: gemini
    display_name: Google Gemini
    adapter: vibe_providers.adapters.gemini:GeminiProvider
    enabled: true
    max_concurrency: 4
    options:
      default_model: gemini-2.5-flash
      thinking_budget: -1        # -1 dynamic | 0 off | N tokens (omit for non-thinking models)
      api_key: AIzaSyAGrm75XDoJeFZXPhUYnmRyTHpBnKbmJ4E

  - id: anthropic-default
    kind: anthropic
    display_name: Anthropic Claude
    adapter: vibe_providers.adapters.anthropic:AnthropicProvider
    enabled: false
    max_concurrency: 4
    options:
      default_model: claude-sonnet-4-5
      thinking_budget: 4096      # extended thinking; must be >= 1024 (omit to disable)
      api_key: ${ANTHROPIC_API_KEY}

  - id: antigravity-headless
    kind: antigravity
    display_name: Antigravity (headless)
    adapter: vibe_providers.adapters.antigravity:AntigravityProvider
    enabled: false
    max_concurrency: 1
    options:
      mode: cli                 # cli | sdk
      executable: agy
      # Flags are unverified until `agy --help` can be checked on this machine.
      args_template: ["-p", "{prompt}", "--output-format", "stream-json"]
      allowed_workspaces: []    # absolute paths; the agent may only run inside these
      skip_permissions: false   # maps to --dangerously-skip-permissions; keep false
