# Reference examples for every provider kind (copy what you need into providers.yaml
# or providers.local.yaml). Not loaded by the app.
version: 1
providers:
  # In-repo module or any importable package: point `adapter` at a class/function
  # with signature (config: AgentProviderConfig, deps: ProviderDeps) -> IAgentProvider.
  - id: crewai-research
    kind: package
    adapter: providers.adapters.package_runner:PackageRunnerProvider
    options:
      mode: inprocess              # inprocess | subprocess
      entrypoint: my_pkg.crew:run_stream
    capabilities:
      idempotent: false

  # Pip-installed third-party package that registered an entry point in group
  # "app.providers": omit `adapter`, set `kind` to the entry-point name.
  - id: from-entry-point
    kind: my-plugin-kind
    options: {}

  - id: openrouter-routed
    kind: openrouter
    adapter: providers.adapters.openrouter:OpenRouterProvider
    options:
      base_url: https://openrouter.ai/api/v1
      default_model: anthropic/claude-sonnet-4
      api_key: ${OPENROUTER_API_KEY}
      provider_routing: { order: [anthropic], allow_fallbacks: true }

  # Resilience testing: first two attempts fail with a rate limit, then succeed.
  - id: fake-flaky
    kind: fake
    adapter: providers.adapters.fake:FakeProvider
    options:
      fail_first_n: 2
      fail_error: rate_limited
      retry_after_s: 0.5
