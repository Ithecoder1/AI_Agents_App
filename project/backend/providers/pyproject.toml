[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-forge-providers"
version = "0.1.0"
description = "Vibe Forge LLM / agent providers: provider kit and adapters (fake, OpenRouter, Gemini, Anthropic, Antigravity, package runner)."
requires-python = ">=3.10"
dependencies = [
    "vibe-forge>=0.1.0",
    "httpx>=0.27.0",
]

# Third-party packages self-register providers the same way (group "vibe.providers").
# Resolution order in ProviderRegistry: config `adapter` import path -> entry point by `kind`.
[project.entry-points."app.providers"]
fake = "providers.adapters.fake:FakeProvider"
openrouter = "providers.adapters.openrouter:OpenRouterProvider"
gemini = "providers.adapters.gemini:GeminiProvider"
anthropic = "providers.adapters.anthropic:AnthropicProvider"

[tool.setuptools]
packages = [
    "providers",
    "providers.kit",
    "providers.adapters",
    "providers.adapters.anthropic",
    "providers.adapters.antigravity",
    "providers.adapters.fake",
    "providers.adapters.gemini",
    "providers.adapters.openrouter",
    "providers.adapters.package_runner",
]

[tool.setuptools.package-dir]
providers = "."

# --------------------------------------------------------------------------- #
# Tooling  (ruff + pytest config live in <project>/ruff.toml and <project>/pytest.ini)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
strict = true
# app is a sibling checkout; resolve it from source for type checking.
mypy_path = "$MYPY_CONFIG_FILE_DIR/../app"
warn_unreachable = true

# --------------------------------------------------------------------------- #
# Architecture contracts  (run: `lint-imports --config backend/providers/pyproject.toml`)
#   adapters -> kit -> app.domain      (providers only ever depend on the domain)
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_packages = ["providers", "app"]

[[tool.importlinter.contracts]]
name = "Adapters build on the kit, never the reverse"
type = "layers"
layers = [
    "providers.adapters",
    "providers.kit",
]

# The extensibility guarantee: providers never import each other. Wildcard covers
# every future provider package automatically (scaffolded or third-party in-repo).
[[tool.importlinter.contracts]]
name = "Providers are independent of one another"
type = "independence"
modules = ["providers.adapters.*"]

# Providers may depend on the domain (models, errors, ports) and the kit - nothing else
# from the app (no infrastructure, application services or API).
[[tool.importlinter.contracts]]
name = "Providers only depend on app.domain"
type = "forbidden"
source_modules = ["providers"]
forbidden_modules = [
    "app.infrastructure",
    "app.application",
    "app.api",
]
