# CLI entry for schema authoring:
#   alembic -c project/backend/app/alembic.ini revision --autogenerate -m "describe change"
#   alembic -c project/backend/app/alembic.ini upgrade head
# The app itself migrates automatically at start-up; the database URL is read from
# VIBE_DB_URL (default: sqlite+aiosqlite:///./data/app.db relative to <project>/).
[alembic]
script_location = %(here)s/infrastructure/persistence/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
